<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAT Photo Archive</title>
    <script>
      // Applied synchronously, before first paint, to avoid a flash of the wrong theme.
      // Kept in sync with src/hooks/useTheme.ts's storage key/values.
      try {
        var t = localStorage.getItem('picaloco-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
