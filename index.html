<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAT Photo Archive</title>
    <script>
      // Applied synchronously, before first paint, to avoid a flash of the wrong theme.
      // Kept in sync with src/hooks/useTheme.ts's storage key/values.
      // A ?theme= link (e.g. ?theme=bespoke from the client's own site menu) wins and is remembered.
      try {
        var valid = { light: 1, dark: 1, bespoke: 1 }
        var fromUrl = new URLSearchParams(location.search).get('theme')
        if (valid[fromUrl]) localStorage.setItem('picaloco-theme', fromUrl)
        var t = valid[fromUrl] ? fromUrl : localStorage.getItem('picaloco-theme')
        if (valid[t]) document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
